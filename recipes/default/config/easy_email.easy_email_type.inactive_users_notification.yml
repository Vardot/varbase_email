bodyHtml:
  value: '<p>Hi [admin_user:display-name],</p><p>This is your monthly security report for inactive user accounts on <a href="[site:url]"><strong>[site:name]</strong></a><strong>.</strong></p><h4>Security Recommendation:</h4><p>We have identified user accounts that have not logged in for over 3 months. For security purposes, we recommend reviewing these accounts and considering the following actions:</p><ol><li>Contact users to verify account status</li><li>Disable accounts that are no longer needed</li><li>Reset passwords for accounts that should remain active</li><li>Review and update user permissions as needed</li></ol><h4>Inactive Accounts Detected:</h4><p>[inactive_users_html_table]</p><p>[inactive_users_total_message]</p><p>&nbsp;</p><p>Please review the user management interface to identify accounts with login dates older than 3 months.</p><p><a href="[site:url]admin/people">Access User Management</a></p><h4>Next Steps:</h4><ul><li>Log into <a href="[site:url]">[site:name]</a></li><li>Review inactive accounts in the user management section</li><li>Take appropriate security measures based on your organization’s policy</li><li>Document any actions taken for audit purposes</li></ul><p>This automated security check helps maintain account hygiene and reduces potential security risks.</p><p>Best regards,<br>[site:name] Security System</p><p>Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br><small>This is an automated security notification.</small></p>'
