bodyHtml:
  value: '<table class="table" style="background-color:#ffffff;border-radius:8px;margin:0 auto;overflow:hidden;" width="100%" border="0" cellspacing="0" cellpadding="0"><tbody><tr><td style="background-color:#1e3a8a;color:#ffffff;font-size:20px;padding:20px;text-align:center;"><strong>[site:name] Security Report</strong></td></tr><tr><td style="padding:20px 0px;text-align:left;"><p style="color:#555;font-size:15px;margin:0;">Hi <strong>[admin_user:display-name]</strong>,</p><p style="color:#555;font-size:15px;margin:10px 0 0 0;">This is your <strong>monthly security report</strong> for inactive user accounts on <a style="color:#1e3a8a;text-decoration:none;" href="[site:url]"><strong>[site:name]</strong></a>.</p></td></tr><tr><td style="padding:20px 0px;"><h3 style="color:#1e3a8a;font-size:18px;margin:0 0 10px 0;">Security Recommendation:</h3><p style="color:#333;font-size:14px;margin:0 0 10px 0;">We have identified accounts that have not logged in for over 3 months. For security purposes, we recommend reviewing these accounts and taking one or more of the following actions:</p><ol style="color:#333;font-size:14px;margin:0;padding-left:18px;"><li>Contact users to verify account status</li><li>Disable accounts that are no longer needed</li><li>Reset passwords for accounts that should remain active</li><li>Review and update user permissions as needed</li></ol></td></tr><tr><td style="padding:20px 0px;"><h3 style="color:#1e3a8a;font-size:18px;margin:0 0 10px 0;">Inactive Accounts Detected:</h3><div style="background-color:#f3f4f6;border-radius:6px;color:#333;font-size:14px;padding:15px;"><p>[inactive_users_html_table]</p><p style="margin-top:10px;">[inactive_users_total_message]</p></div></td></tr><tr><td style="padding:20px 0px;text-align:center;"><a style="background-color:#1e3a8a;border-radius:6px;color:#ffffff;display:inline-block;padding:12px 24px;text-decoration:none;" href="[site:url]admin/people"><strong>Access User Management&nbsp;</strong></a></td></tr><tr><td style="padding:20px 0px;text-align:left;"><h3 style="color:#1e3a8a;font-size:18px;margin:0 0 10px 0;">Next Steps:</h3><ul style="color:#333;font-size:14px;margin:0;padding-left:18px;"><li>Log into <a style="color:#1e3a8a;text-decoration:none;" href="[site:url]">[site:name]</a></li><li>Review inactive accounts in the user management section</li><li>Take security measures per your organization’s policy</li><li>Document any actions taken for audit purposes</li></ul></td></tr><tr><td style="background-color:#f9fafb;color:#888;font-size:12px;padding:20px;text-align:center;"><p style="margin:0 0 10px 0;">This automated security check helps maintain account hygiene and reduce risks.</p><p style="color:#888;font-size:12px;margin:0;">Best regards,<br>[site:name] Security System</p><p style="color:#aaa;font-size:11px;margin:10px 0 0 0;">Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br><small>This is an automated notification. Do not reply.</small></p></td></tr></tbody><!-- Header --><!-- Intro --><!-- Recommendation --><!-- Inactive Accounts --><!-- CTA --><!-- Next Steps --><!-- Footer --></table>'
  format: email_html
