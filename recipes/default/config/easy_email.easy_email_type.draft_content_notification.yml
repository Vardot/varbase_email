bcc: {  }
fromName: '[site:name]'
fromAddress: '[site:mail]'
replyToAddress: ''
subject: 'Draft Content Reminder: [site:name]'
inboxPreview: ''
bodyHtml:
  value: '<table class="table" style="background-color:#ffffff;border-radius:8px;margin:0 auto;overflow:hidden;" width="100%" border="0" cellspacing="0" cellpadding="0"><tbody><tr><td style="background-color:#1e3a8a;color:#ffffff;font-size:20px;padding:20px;text-align:center;"><strong>[site:name] Content Management Report</strong></td></tr><tr><td style="padding:20px 0px;text-align:left;"><p style="color:#555;font-size:15px;margin:0;">Hi <strong>[admin_user:display-name]</strong>,</p><p style="color:#555;font-size:15px;margin:10px 0 0 0;">This is a reminder that there are unpublished draft content items on <a style="color:#1e3a8a;text-decoration:none;" href="[site:url]"><strong>[site:name]</strong></a>. Below is a list of <strong>outdated drafts</strong> currently awaiting review or publishing.</p></td></tr><tr><td style="padding:20px 0px;"><h3 style="color:#1e3a8a;font-size:18px;margin:0 0 10px 0;">Outdated Drafts:</h3><div style="background-color:#f3f4f6;border-radius:6px;color:#333;font-size:14px;padding:15px;"><p>[draft_content_html_table]</p><p style="margin-top:10px;">[draft_content_total_message]</p></div></td></tr><tr><td style="padding:20px 0px;text-align:left;"><p style="color:#333;font-size:14px;margin:0;">For a complete overview of all drafts and pending content, please use the moderation interface.</p></td></tr><tr><td style="padding:20px 0px;text-align:center;"><a style="background-color:#1e3a8a;border-radius:6px;color:#ffffff;display:inline-block;padding:12px 24px;text-decoration:none;" href="[site:url]admin/content/moderated"><strong>Access Content Moderation</strong></a></td></tr><tr><td style="padding:20px 0px;text-align:left;"><h3 style="color:#1e3a8a;font-size:18px;margin:0 0 10px 0;">Next Steps:</h3><ul style="color:#333;font-size:14px;margin:0;padding-left:18px;"><li>Review draft content for accuracy and completeness</li><li>Publish items that are ready</li><li>Archive or delete drafts that are no longer needed</li><li>Ensure editorial workflow policies are followed</li></ul></td></tr><tr><td style="background-color:#f9fafb;color:#888;font-size:12px;padding:20px;text-align:center;"><p style="margin:0 0 10px 0;">This automated reminder helps keep content fresh and ensures no drafts remain forgotten.</p><p style="color:#888;font-size:12px;margin:0;">Best regards,<br><strong>[site:name] Content Team</strong></p><p style="color:#aaa;font-size:11px;margin:10px 0 0 0;">Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br><small>This is an automated editorial workflow notification.</small></p></td></tr></tbody></table>'
  format: email_html
