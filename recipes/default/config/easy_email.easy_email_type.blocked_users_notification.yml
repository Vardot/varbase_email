bodyHtml:
  value: '<p>Hi [admin_user:display-name],</p><p>This is your monthly security report for <strong>blocked user accounts</strong> on <a href="[site:url]"><strong>[site:name]</strong></a>.</p><h4>Security Recommendation:</h4><p>We have identified user accounts that were automatically blocked because they did not log in for over 3 months, and an additional 10 days grace period has passed without login (100 days total). For security purposes, we recommend reviewing these accounts and considering the following actions:</p><ol><li>Verify whether the accounts are still needed</li><li>Permanently delete accounts that are no longer required</li><li>Document user requests if accounts need to be reactivated</li><li>Review audit logs to ensure no unusual activity before the block</li></ol><h4>Blocked Accounts Detected:</h4><p>[blocked_users_html_table]</p><p>[blocked_users_total_message]</p><p>&nbsp;</p><p>Please review the user management interface to confirm accounts that have been blocked after 100 days of inactivity.</p><p><a href="[site:url]admin/people?login%5Bmin%5D%5Bdate%5D=[current-date:custom:Y-m-d:-91 days]&amp;login%5Bmax%5D%5Bdate%5D=[current-date:custom:Y-m-d:-100 days]&amp;items_per_page=50">Access User Management</a></p><h4>Next Steps:</h4><ul><li>Log into <a href="[site:url]">[site:name]</a></li><li>Review blocked accounts in the user management section</li><li>Take appropriate measures based on your organization’s security policy</li><li>Keep a record of any actions taken for compliance and auditing</li></ul><p>This automated security check helps maintain account hygiene and reduces potential security risks.</p><p>Best regards,<br><strong>[site:name] Security System</strong></p><p>Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br><small>This is an automated security notification.</small></p>'
