  value: '<table style="background:#ffffff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.05);margin:0 auto;max-width:650px;overflow:hidden;" width="100%" border="0" cellspacing="0" cellpadding="0"><!-- Header --><tbody><tr><td style="background:#2d2d5a;color:#ffffff;font-size:20px;padding:20px;text-align:center;"><p><strong>[site:name] Security Alert – Blocked Accounts</strong></p></td></tr><!-- Intro --><tr><td style="padding:20px;text-align:left;"><p style="color:#555;font-size:15px;margin:0;">Hi <strong>[admin_user:display-name]</strong>,</p><p style="color:#555;font-size:15px;margin:10px 0 0 0;">This is your <strong>monthly security report</strong> for <strong>blocked user accounts</strong> on <a style="color:#2d2d5a;text-decoration:none;" href="[site:url]"><strong>[site:name]</strong></a>.</p></td></tr><!-- Security Recommendation --><tr><td style="padding:0 20px 20px 20px;"><h3 style="color:#2d2d5a;font-size:18px;margin:0 0 10px 0;">Security Recommendation:</h3><p style="color:#333;font-size:14px;margin:0 0 10px 0;">We have identified accounts that were <strong>automatically blocked</strong> due to inactivity for over <strong>3 months + 10 days grace period (100 days total)</strong>. Please review and take action:</p><ol style="color:#333;font-size:14px;margin:0;padding-left:18px;"><li>Verify whether the accounts are still needed</li><li>Permanently delete accounts that are no longer required</li><li>Document user requests if accounts need to be reactivated</li><li>Review audit logs to ensure no unusual activity before the block</li></ol></td></tr><!-- Blocked Accounts --><tr><td style="padding:0 20px 20px 20px;"><h3 style="color:#2d2d5a;font-size:18px;margin:0 0 10px 0;">Blocked Accounts Detected:</h3><div style="background:#f3f4f6;border-radius:6px;border:1px solid #e5e7eb;color:#333;font-size:14px;padding:15px;"><p>[blocked_users_html_table]</p><p style="margin-top:10px;">[blocked_users_total_message]</p></div></td></tr><!-- CTA --><tr><td style="padding:20px;text-align:center;"><p><a style="background:#2d2d5a;border-radius:6px;color:#ffffff;display:inline-block;padding:12px 24px;text-decoration:none;" href="[site:url]admin/people?login%5Bmin%5D%5Bdate%5D=[current-date:custom:Y-m-d:-91 days]&amp;login%5Bmax%5D%5Bdate%5D=[current-date:custom:Y-m-d:-100 days]&amp;items_per_page=50"><strong>Access User Management&nbsp;</strong></a></p></td></tr><!-- Next Steps --><tr><td style="padding:20px;text-align:left;"><h3 style="color:#2d2d5a;font-size:18px;margin:0 0 10px 0;">Next Steps:</h3><ul style="color:#333;font-size:14px;margin:0;padding-left:18px;"><li>Log into <a style="color:#2d2d5a;text-decoration:none;" href="[site:url]">[site:name]</a></li><li>Review blocked accounts in the user management section</li><li>Take appropriate measures per your security policy</li><li>Keep a record of any actions taken for compliance and auditing</li></ul></td></tr><!-- Footer --><tr><td style="background:#f9fafb;color:#888;font-size:12px;padding:20px;text-align:center;"><p style="margin:0 0 10px 0;">This automated security check helps maintain account hygiene and reduce risks.</p><p style="color:#888;font-size:12px;margin:0;">Best regards,<br><strong>[site:name] Security System</strong></p><p style="color:#aaa;font-size:11px;margin:10px 0 0 0;">Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br><small>This is an automated notification. Do not reply.</small></p></td></tr></tbody></table>'
