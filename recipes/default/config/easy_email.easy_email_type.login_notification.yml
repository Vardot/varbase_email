langcode: en
status: true
dependencies: {  }
id: login_notification
label: 'Login Notification'
key: ''
recipient:
  - '[logged_user:mail]'
cc: {  }
bcc: {  }
fromName: '[site:name]'
fromAddress: '[site:mail]'
replyToAddress: ''
subject: 'New sign-in to your [site:name] account'
inboxPreview: ''
bodyHtml:
  value: '<table style="background:#ffffff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.05);margin:0 auto;max-width:600px;overflow:hidden;" width="100%" border="0" cellspacing="0" cellpadding="0"><!-- Header --><tbody><tr><td style="background:#2d2d5a;color:#ffffff;font-size:20px;padding:20px;text-align:center;"><p><strong>[site:name]</strong></p></td></tr><!-- Title --><tr><td style="padding:20px;text-align:left;"><h2 style="color:#2d2d5a;font-size:22px;margin:0;">New sign-in detected</h2><p style="color:#555;font-size:15px;margin:10px 0 0 0;">Hi <strong>[logged_user:account-name]</strong>,<br><br>We noticed a new sign-in to your account. Here are the details:</p></td></tr><!-- Info Box --><tr><td style="padding:0 20px 20px 20px;"><table style="background:#f3f4f6;border-radius:6px;color:#333;font-size:14px;" width="100%" cellpadding="10" cellspacing="0" border="0"><tbody><tr><td><p><strong>Login Time:</strong></p></td><td><p>[logged_user:last-login:custom:Y-m-d H:i:s T]</p></td></tr><tr><td><p><strong>IP Address:</strong></p></td><td><p>[logged_user_ip_address]</p></td></tr><tr><td><p><strong>User Agent:</strong></p></td><td><p>[logged_user_agent]</p></td></tr><tr><td><p><strong>Location:</strong></p></td><td><p>[logged_user_location]</p></td></tr></tbody></table></td></tr><!-- Action --><tr><td style="padding:20px;text-align:center;"><p style="color:#555;font-size:15px;margin-bottom:20px;">If this wasn’t you, please secure your account immediately.</p><p><a style="background:#2d2d5a;border-radius:6px;color:#ffffff;display:inline-block;padding:12px 24px;text-decoration:none;" href="[site:url]/user/[logged_user:uid]/profile"><strong>Check Your Profile&nbsp;</strong></a></p></td></tr><!-- Footer --><tr><td style="color:#888;font-size:12px;padding:15px;text-align:center;"><p>This is an automated security email from [site:name].</p></td></tr></tbody></table>'
  format: email_html
bodyPlain: ''
generateBodyPlain: true
attachment: {  }
saveAttachment: false
attachmentScheme: public
attachmentDirectory: ''
saveEmail: true
allowSavingEmail: true
purgeEmails: false
purgeInterval: null
purgePeriod: null
