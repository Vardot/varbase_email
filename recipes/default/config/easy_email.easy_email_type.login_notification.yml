langcode: en
status: true
dependencies: {  }
id: login_notification
label: 'Login Notification'
key: ''
recipient:
  - '[logged_user:mail]'
cc: {  }
bcc: {  }
fromName: '[site:name]'
fromAddress: '[site:mail]'
replyToAddress: ''
subject: 'New sign-in to your [site:name] account'
inboxPreview: ''
bodyHtml:
  value: '<table class="table" style="border-radius:8px;overflow:hidden;" width="100%" border="0" cellspacing="0" cellpadding="0"><tbody><tr><td style="background-color:#2d2d5a;color:#ffffff;font-size:20px;padding:20px;text-align:center;"><strong>[site:name]</strong></td></tr><tr><td style="padding:20px 0px;text-align:left;"><h2 style="color:#2d2d5a;font-size:22px;margin:0;">New sign-in detected</h2><p style="color:#555;font-size:15px;margin:10px 0 0 0;">Hi <strong>[logged_user:account-name]</strong>,<br><br>We noticed a new sign-in to your account. Here are the details:</p></td></tr><tr><td style="padding:0;"><table class="table" style="background-color:#f3f4f6;border-radius:6px;color:#333;font-size:14px;" width="100%" cellpadding="10" cellspacing="0" border="0"><tbody><tr><td style="min-width:82px;"><strong>Login Time:</strong></td><td>[logged_user:last-login:custom:Y-m-d H:i:s T]</td></tr><tr><td><strong>IP Address:</strong></td><td>[logged_user_ip_address]</td></tr><tr><td><strong>User Agent:</strong></td><td>[logged_user_agent]</td></tr><tr><td><strong>Location:</strong></td><td>[logged_user_location]</td></tr></tbody></table></td></tr><tr><td style="padding:20px 0px;text-align:center;"><p style="color:#555;font-size:15px;margin-bottom:20px;">If this wasn’t you, please secure your account immediately.</p><p><a style="background-color:#2d2d5a;border-radius:6px;color:#ffffff;display:inline-block;padding:12px 24px;text-decoration:none;" href="[site:url]/user/[logged_user:uid]"><strong>Check Your Profile</strong></a></p></td></tr><tr><td style="color:#888;font-size:12px;padding:15px;text-align:center;">This is an automated security email from [site:name].</td></tr></tbody></table>'
  format: email_html
bodyPlain: ''
generateBodyPlain: true
attachment: {  }
saveAttachment: false
attachmentScheme: public
attachmentDirectory: ''
saveEmail: true
allowSavingEmail: true
purgeEmails: false
purgeInterval: null
purgePeriod: null
