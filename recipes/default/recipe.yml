name: Varbase Email - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - symfony_mailer
  - easy_email
config:
  import:
    symfony_mailer: "*"
    easy_email: "*"
  actions:
    user.role.site_admin:
      grantPermissions:
        - 'administer shortcuts'
        - 'customize shortcut links'
