bodyHtml:
  value: "  <p>Hi [admin_user:display-name],</p>\r\n\r\n  <p>\r\n    This is your monthly security report for inactive user accounts on <strong><a href=\"[site:url]\">[site:name]</a><strong>.\r\n  </p>\r\n\r\n  <h3>Security Recommendation:</h3>\r\n  <p>\r\n    We have identified user accounts that have not logged in for over 3 months.  \r\n    For security purposes, we recommend reviewing these accounts and considering the following actions:\r\n  </p>\r\n  <ol>\r\n    <li>Contact users to verify account status</li>\r\n    <li>Disable accounts that are no longer needed</li>\r\n    <li>Reset passwords for accounts that should remain active</li>\r\n    <li>Review and update user permissions as needed</li>\r\n  </ol>\r\n\r\n  <h3>Inactive Accounts Detected:</h3>\r\n  <p>[inactive_users_html_table]</p>\r\n  <p>\r\n    Please review the user management interface to identify accounts with login dates older than 3 months.\r\n  </p>\r\n\r\n  <p>\r\n    <a href=\"[site:url]admin/people\">Access User Management</a>\r\n  </p>\r\n\r\n  <h3>Next Steps:</h3>\r\n  <ul>\r\n    <li>Log into <a href=\"[site:url]\">[site:name]</a></li>\r\n    <li>Review inactive accounts in the user management section</li>\r\n    <li>Take appropriate security measures based on your organization’s policy</li>\r\n    <li>Document any actions taken for audit purposes</li>\r\n  </ul>\r\n\r\n  <p>\r\n    This automated security check helps maintain account hygiene and reduces potential security risks.\r\n  </p>\r\n\r\n  <p>Best regards,<br><strong>[site:name] Security System</strong></p>\r\n\r\n  <p>\r\n    Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br>\r\n    <small>This is an automated security notification.</small>\r\n  </p>"
