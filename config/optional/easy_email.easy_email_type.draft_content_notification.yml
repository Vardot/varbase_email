langcode: en
status: true
dependencies: {  }
id: draft_content_notification
label: 'Draft Content Notification'
key: ''
recipient:
  - '[admin_user:mail]'
cc: {  }
bcc: {  }
fromName: '[site:name]'
fromAddress: '[site:mail]'
replyToAddress: ''
subject: 'Draft Content Reminder: [site:name]'
inboxPreview: ''
bodyHtml:
  value: "  <p>Hi [admin_user:display-name],</p>\r\n\r\n  <p>\r\n    This is a reminder that there are unpublished draft content items on \r\n    <strong><a href=\"[site:url]\">[site:name]</a></strong>.  \r\n    Below is a list of <strong>outdated drafts</strong> currently awaiting review or publishing.\r\n  </p>\r\n\r\n  <h3>Outdated Drafts</h3>\r\n[draft_content_html_table]\r\n\r\n  <p>\r\n    For a complete overview of all drafts and pending content, please use the moderation interface.\r\n  </p>\r\n\r\n  <p>\r\n    <a href=\"[site:url]admin/content/moderated\">Access Content Moderation</a>\r\n  </p>\r\n\r\n  <h3>Next Steps:</h3>\r\n  <ul>\r\n    <li>Review draft content for accuracy and completeness</li>\r\n    <li>Publish items that are ready</li>\r\n    <li>Archive or delete drafts that are no longer needed</li>\r\n    <li>Ensure editorial workflow policies are followed</li>\r\n  </ul>\r\n\r\n  <p>\r\n    This automated reminder helps keep content fresh and ensures no drafts remain forgotten.\r\n  </p>\r\n\r\n  <p>Best regards,<br><strong>[site:name] Content Team</strong></p>\r\n\r\n  <p>\r\n    Generated: <em>[current-date:custom:Y-m-d H:i:s T]</em><br>\r\n    <small>This is an automated editorial workflow notification.</small>\r\n  </p>"
  format: email_html
bodyPlain: ''
generateBodyPlain: true
attachment: {  }
saveAttachment: false
